name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allows deploying from the Actions tab without pushing a commit.
  workflow_dispatch:

# Least privilege, plus the two permissions a Pages deployment requires.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Runs already in progress are never cancelled, so a
# half-finished deployment cannot leave the site in a broken state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Both are optional. When unset, `astro.config.mjs` derives the URL
          # and base path from GITHUB_REPOSITORY, which covers user pages,
          # project pages and forks without any hard-coded username.
          # Set these as repository variables to use a custom domain.
          SITE_URL: ${{ vars.SITE_URL }}
          BASE_PATH: ${{ vars.BASE_PATH }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
